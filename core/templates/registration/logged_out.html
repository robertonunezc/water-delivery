{% extends 'base_auth.html' %}

{% block title %}Sesión Cerrada - PuriGest{% endblock %}

{% block content %}
<div class="login-box">
    <div class="white-box text-center p-t-30 p-b-30">
        <i class="fas fa-sign-out-alt fa-3x text-success m-b-15"></i>
        <h3 class="box-title text-success">Sesión Cerrada</h3>
        <p class="text-muted m-b-20">Has cerrado sesión exitosamente.</p>
        <a href="{% url 'core:login' %}" class="btn btn-info btn-lg btn-block text-uppercase waves-effect waves-light">
            <i class="fas fa-sign-in-alt m-r-5"></i>Iniciar Sesión Nuevamente
        </a>
    </div>
</div>
{% endblock %}
